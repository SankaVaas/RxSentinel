apiVersion: apps/v1
kind: Deployment
metadata:
  name: rxsentinel-frontend
  labels:
    app: rxsentinel-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rxsentinel-frontend
  template:
    metadata:
      labels:
        app: rxsentinel-frontend
    spec:
      containers:
        - name: frontend
          image: rxsentinel-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: rxsentinel-frontend
spec:
  selector:
    app: rxsentinel-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
